services:
  - type: web
    name: helpdesk360
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn "backend.app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk360-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"

databases:
  - name: helpdesk360-db
    databaseName: helpdesk360
    user: helpdesk360
    plan: free
